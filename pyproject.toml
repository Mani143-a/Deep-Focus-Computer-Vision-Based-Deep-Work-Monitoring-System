[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "deepfocus"
version = "1.0.0"

description = "Real-time computer vision deep-work monitoring system"

readme = "README.md"

requires-python = ">=3.11"

license = { text = "MIT" }

authors = [
    { name = "DeepFocus" }
]

dependencies = [
    "numpy",
    "opencv-python",
    "mediapipe",
    "streamlit",
    "scikit-learn",
    "joblib",
    "pandas",
    "matplotlib",
]


[project.scripts]
deepfocus = "app.cli:main"


[tool.setuptools]
include-package-data = true


[tool.setuptools.packages.find]
include = [
    "app",
    "app.*",
]


[tool.pytest.ini_options]
testpaths = [
    "tests",
]

python_files = [
    "test_*.py",
]

python_classes = [
    "Test*",
]

python_functions = [
    "test_*",
]

addopts = "-q"